# ╔═════════════════════════════════════════════════════════════════════════╗
# ║                    Panicast CI/CD Pipeline                              ║
# ║          Linux x64 · Build → Test → Package → Release                    ║
# ╚═════════════════════════════════════════════════════════════════════════╝
#
# 2026-08-16 rebuild: the old 4-platform matrix (macOS brew / Windows vcpkg /
#   ARM64 cross) never produced a green run — Windows lacked a manifest-driven
#   dep set, macOS keg-only paths were invisible to CMake, and ARM64 had no
#   cross sysroot for mpv/curl/sqlite/…. Panicast is a Linux ncurses TUI built
#   against system libmpv; releases are Linux x64 only (built on Ubuntu 24.04,
#   matching the reference dev environment: libmpv2 / libfmt10 / ncursesw6).
#
# Flow:
#   push main / workflow_dispatch → build + ctest + upload artifact (CI check)
#   push tag v*                   → same build; if tests pass, publish a
#                                  GitHub Release with the tarball + sha256.

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ===========================================================================
  # Build & Test — Linux x64 (Ubuntu 24.04)
  # ===========================================================================
  build-linux:
    name: Build & Test (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libncurses-dev libcurl4-openssl-dev \
            libsqlite3-dev libxml2-dev libfmt-dev nlohmann-json3-dev \
            libqrencode-dev libssl-dev libgtest-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cd build
          cpack -G TGZ
          src_tar=$(ls Panicast-*.tar.gz | head -n1)
          cd ..
          dest="panicast-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          mv "build/$src_tar" "$dest"
          sha256sum "$dest" > "$dest.sha256"
          ls -la panicast-*

      - uses: actions/upload-artifact@v4
        with:
          name: panicast-linux-x64
          path: |
            panicast-*.tar.gz
            panicast-*.sha256
          if-no-files-found: error

  # ===========================================================================
  # Release — publish automatically when a v* tag is pushed AND tests passed
  # ===========================================================================
  release:
    name: Publish Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: panicast-linux-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Panicast ${{ github.ref_name }}

          Linux x64 release build (Ubuntu 24.04). 自动发布：CI 构建并通过全部单元测试后由 GitHub Actions 生成。
          完整变更记录见仓库 `CHANGELOG.md`。

          ### Runtime requirements (Ubuntu 24.04 / Debian 13+)

          ```bash
          sudo apt install mpv libmpv2 libncursesw6 libfmt10 libcurl4 \
                           libxml2 libsqlite3-0 libqrencode4
          # 可选：ffmpeg yt-dlp（在线节目解析/下载）、whisper.cpp（AI 字幕）
          ```

          ### Install

          ```bash
          sha256sum -c panicast-*-linux-x64.tar.gz.sha256
          tar xf panicast-*-linux-x64.tar.gz
          sudo cp Panicast-*/bin/panicast /usr/local/bin/
          ```
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release for $TAG already exists — uploading assets (clobber)."
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Panicast $TAG" \
              --notes-file notes.md
          fi
